# TradeCore production stack — dedicated VPS (formationdouane.online)
#
# Deploy:
#   1. Copy repo to /opt/tradecore on the VPS
#   2. Create .env.production (see .env.production.example)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# TLS: Cloudflare Origin Certificate
#   Place origin.pem and origin-key.pem in ./certs/
#   Set Cloudflare SSL/TLS mode to "Full (strict)"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tradecore}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradecore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradecore

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradecore

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-obamg/trading_gang}/api:${API_IMAGE_TAG:-latest}
    build:
      context: ./tradecore
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: https://formationdouane.online
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://formationdouane.online/api/auth/google/callback
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@formationdouane.online}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TradeCore}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      WHALE_ALERT_API_KEY: ${WHALE_ALERT_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      BINANCE_STREAMS_ENABLED: ${BINANCE_STREAMS_ENABLED:-true}
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-bybit}
      BINANCE_MIN_QUOTE_VOLUME_USD: ${BINANCE_MIN_QUOTE_VOLUME_USD:-10000000}
      WALLETWATCH_ENABLED: ${WALLETWATCH_ENABLED:-false}
      WALLETWATCH_MIN_USD: ${WALLETWATCH_MIN_USD:-25000}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_ENABLED: ${DISCOVERY_AUTO_PROMOTE_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_MIN_SCORE: ${DISCOVERY_AUTO_PROMOTE_MIN_SCORE:-250000}
      DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD: ${DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD:-50000}
      DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE: ${DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE:-0.7}
      DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT: ${DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT:-5}
      DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK: ${DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK:-5}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      LISTINGWATCH_ENABLED: ${LISTINGWATCH_ENABLED:-false}
      AWAKENING_ENABLED: ${AWAKENING_ENABLED:-false}
      WAVEWATCH_ENABLED: ${WAVEWATCH_ENABLED:-false}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      BOT_PAPER_EQUITY_INITIAL: ${BOT_PAPER_EQUITY_INITIAL:-10000}
      BOT_POSITION_SIZE_PCT: ${BOT_POSITION_SIZE_PCT:-0.05}
      BOT_RISK_PER_TRADE_PCT: ${BOT_RISK_PER_TRADE_PCT:-0.0025}
      BOT_MAX_CONCURRENT: ${BOT_MAX_CONCURRENT:-5}
      BOT_TAKE_PROFIT_R_MULTIPLE: ${BOT_TAKE_PROFIT_R_MULTIPLE:-2.0}
      BOT_STOP_BUFFER_PCT: ${BOT_STOP_BUFFER_PCT:-0.0005}
      BOT_PER_SYMBOL_COOLDOWN_MINUTES: ${BOT_PER_SYMBOL_COOLDOWN_MINUTES:-120}
      BOT_MAX_HOLD_HOURS: ${BOT_MAX_HOLD_HOURS:-24}
      BOT_FEE_PCT_PER_SIDE: ${BOT_FEE_PCT_PER_SIDE:-0.0006}
      BOT_SLIPPAGE_PCT: ${BOT_SLIPPAGE_PCT:-0.0005}
      BOT_FUNDING_INTERVAL_HOURS: ${BOT_FUNDING_INTERVAL_HOURS:-8}
      BOT_LONG_ENABLED: ${BOT_LONG_ENABLED:-true}
      BOT_SHORT_ENABLED: ${BOT_SHORT_ENABLED:-true}
      BOT_MAX_OPEN_RISK_PCT: ${BOT_MAX_OPEN_RISK_PCT:-0}
      BOT_LOSS_THROTTLE_STOPS: ${BOT_LOSS_THROTTLE_STOPS:-0}
      BOT_LOSS_THROTTLE_WINDOW_HOURS: ${BOT_LOSS_THROTTLE_WINDOW_HOURS:-6}
      BOT_LOSS_THROTTLE_FACTOR: ${BOT_LOSS_THROTTLE_FACTOR:-0.5}
      BOT_LOSS_THROTTLE_COOLDOWN_HOURS: ${BOT_LOSS_THROTTLE_COOLDOWN_HOURS:-24}
      BOT_MAX_TURNOVER_NOTIONAL_PCT: ${BOT_MAX_TURNOVER_NOTIONAL_PCT:-0}
      BOT_PERP_ONLY: ${BOT_PERP_ONLY:-true}
      BOT_SYMBOL_BLOCKLIST: ${BOT_SYMBOL_BLOCKLIST:-ESUSDT,ESPORTSUSDT,SIRENUSDT}
      BOT_MIN_TURNOVER_USD: ${BOT_MIN_TURNOVER_USD:-0}
      BOT_DAILY_DRAWDOWN_CAP_PCT: ${BOT_DAILY_DRAWDOWN_CAP_PCT:-0.05}
      BOT_ORACLE_VETO_LONG_BELOW: ${BOT_ORACLE_VETO_LONG_BELOW:--30}
      BOT_ORACLE_VETO_SHORT_ABOVE: ${BOT_ORACLE_VETO_SHORT_ABOVE:-30}
      BOT_NEWS_VETO_WINDOW_MINUTES: ${BOT_NEWS_VETO_WINDOW_MINUTES:-30}
      BOT_ENTRY_DELAY_SECONDS: ${BOT_ENTRY_DELAY_SECONDS:-60}
      BOT_MONITOR_TICK_SECONDS: ${BOT_MONITOR_TICK_SECONDS:-30}
      BOT_LIVE_ENABLED: ${BOT_LIVE_ENABLED:-false}
      BOT_LIVE_LEVERAGE: ${BOT_LIVE_LEVERAGE:-5}
      SCHEDULER_ENABLED: "false"
      RUN_MIGRATIONS: "1"
      RUN_SEED: "0"
    networks:
      - tradecore

  scheduler:
    image: ghcr.io/${GITHUB_REPOSITORY:-obamg/trading_gang}/api:${API_IMAGE_TAG:-latest}
    build:
      context: ./tradecore
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: https://formationdouane.online
      BINANCE_STREAMS_ENABLED: "false"
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-bybit}
      BINANCE_MIN_QUOTE_VOLUME_USD: ${BINANCE_MIN_QUOTE_VOLUME_USD:-10000000}
      WALLETWATCH_ENABLED: ${WALLETWATCH_ENABLED:-false}
      WALLETWATCH_MIN_USD: ${WALLETWATCH_MIN_USD:-25000}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_ENABLED: ${DISCOVERY_AUTO_PROMOTE_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_MIN_SCORE: ${DISCOVERY_AUTO_PROMOTE_MIN_SCORE:-250000}
      DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD: ${DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD:-50000}
      DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE: ${DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE:-0.7}
      DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT: ${DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT:-5}
      DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK: ${DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK:-5}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      LISTINGWATCH_ENABLED: ${LISTINGWATCH_ENABLED:-false}
      AWAKENING_ENABLED: ${AWAKENING_ENABLED:-false}
      WAVEWATCH_ENABLED: ${WAVEWATCH_ENABLED:-false}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      BOT_PAPER_EQUITY_INITIAL: ${BOT_PAPER_EQUITY_INITIAL:-10000}
      BOT_POSITION_SIZE_PCT: ${BOT_POSITION_SIZE_PCT:-0.05}
      BOT_RISK_PER_TRADE_PCT: ${BOT_RISK_PER_TRADE_PCT:-0.0025}
      BOT_MAX_CONCURRENT: ${BOT_MAX_CONCURRENT:-5}
      BOT_TAKE_PROFIT_R_MULTIPLE: ${BOT_TAKE_PROFIT_R_MULTIPLE:-2.0}
      BOT_STOP_BUFFER_PCT: ${BOT_STOP_BUFFER_PCT:-0.0005}
      BOT_PER_SYMBOL_COOLDOWN_MINUTES: ${BOT_PER_SYMBOL_COOLDOWN_MINUTES:-120}
      BOT_MAX_HOLD_HOURS: ${BOT_MAX_HOLD_HOURS:-24}
      BOT_FEE_PCT_PER_SIDE: ${BOT_FEE_PCT_PER_SIDE:-0.0006}
      BOT_SLIPPAGE_PCT: ${BOT_SLIPPAGE_PCT:-0.0005}
      BOT_FUNDING_INTERVAL_HOURS: ${BOT_FUNDING_INTERVAL_HOURS:-8}
      BOT_LONG_ENABLED: ${BOT_LONG_ENABLED:-true}
      BOT_SHORT_ENABLED: ${BOT_SHORT_ENABLED:-true}
      BOT_MAX_OPEN_RISK_PCT: ${BOT_MAX_OPEN_RISK_PCT:-0}
      BOT_LOSS_THROTTLE_STOPS: ${BOT_LOSS_THROTTLE_STOPS:-0}
      BOT_LOSS_THROTTLE_WINDOW_HOURS: ${BOT_LOSS_THROTTLE_WINDOW_HOURS:-6}
      BOT_LOSS_THROTTLE_FACTOR: ${BOT_LOSS_THROTTLE_FACTOR:-0.5}
      BOT_LOSS_THROTTLE_COOLDOWN_HOURS: ${BOT_LOSS_THROTTLE_COOLDOWN_HOURS:-24}
      BOT_MAX_TURNOVER_NOTIONAL_PCT: ${BOT_MAX_TURNOVER_NOTIONAL_PCT:-0}
      BOT_PERP_ONLY: ${BOT_PERP_ONLY:-true}
      BOT_SYMBOL_BLOCKLIST: ${BOT_SYMBOL_BLOCKLIST:-ESUSDT,ESPORTSUSDT,SIRENUSDT}
      BOT_MIN_TURNOVER_USD: ${BOT_MIN_TURNOVER_USD:-0}
      BOT_DAILY_DRAWDOWN_CAP_PCT: ${BOT_DAILY_DRAWDOWN_CAP_PCT:-0.05}
      BOT_ORACLE_VETO_LONG_BELOW: ${BOT_ORACLE_VETO_LONG_BELOW:--30}
      BOT_ORACLE_VETO_SHORT_ABOVE: ${BOT_ORACLE_VETO_SHORT_ABOVE:-30}
      BOT_NEWS_VETO_WINDOW_MINUTES: ${BOT_NEWS_VETO_WINDOW_MINUTES:-30}
      BOT_ENTRY_DELAY_SECONDS: ${BOT_ENTRY_DELAY_SECONDS:-60}
      BOT_MONITOR_TICK_SECONDS: ${BOT_MONITOR_TICK_SECONDS:-30}
      BOT_LIVE_ENABLED: ${BOT_LIVE_ENABLED:-false}
      BOT_LIVE_LEVERAGE: ${BOT_LIVE_LEVERAGE:-5}
      SCHEDULER_ENABLED: "true"
      WHALE_ALERT_API_KEY: ${WHALE_ALERT_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
    command: ["python", "-m", "app.services.scheduler_standalone"]
    healthcheck:
      disable: true
    networks:
      - tradecore

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-obamg/trading_gang}/frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: wss://formationdouane.online/ws
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - tradecore

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/cloudflare:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - tradecore

volumes:
  pg_data:
  redis_data:
  letsencrypt:
  certbot_www:

networks:
  tradecore:
    driver: bridge
