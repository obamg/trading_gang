# TradeCore production stack — dedicated VPS (getmove.online)
#
# Deploy:
#   1. Copy repo to /opt/tradecore on the VPS
#   2. Create .env.production (see .env.production.example)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# TLS: Cloudflare Origin Certificate
#   Place origin.pem and origin-key.pem in ./certs/
#   Set Cloudflare SSL/TLS mode to "Full (strict)"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tradecore}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradecore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradecore

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradecore

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-obamg/trading_gang}/api:${API_IMAGE_TAG:-latest}
    build:
      context: ./tradecore
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: https://getmove.online
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://getmove.online/api/auth/google/callback
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@getmove.online}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TradeCore}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      WHALE_ALERT_API_KEY: ${WHALE_ALERT_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      SANTIMENT_API_KEY: ${SANTIMENT_API_KEY:-}
      # SANAPI FREE serves data >30d old and rejects a query whose `to` is past
      # that ceiling. Set to 0 on a paid plan to collect up to today.
      CHAINPULSE_LAG_DAYS: ${CHAINPULSE_LAG_DAYS:-31}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      BINANCE_STREAMS_ENABLED: ${BINANCE_STREAMS_ENABLED:-true}
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-bybit}
      BINANCE_MIN_QUOTE_VOLUME_USD: ${BINANCE_MIN_QUOTE_VOLUME_USD:-10000000}
      WALLETWATCH_ENABLED: ${WALLETWATCH_ENABLED:-false}
      WALLETWATCH_MIN_USD: ${WALLETWATCH_MIN_USD:-25000}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_ENABLED: ${DISCOVERY_AUTO_PROMOTE_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_MIN_SCORE: ${DISCOVERY_AUTO_PROMOTE_MIN_SCORE:-250000}
      DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD: ${DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD:-50000}
      DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE: ${DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE:-0.7}
      DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT: ${DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT:-5}
      DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK: ${DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK:-5}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      LISTINGWATCH_ENABLED: ${LISTINGWATCH_ENABLED:-false}
      AWAKENING_ENABLED: ${AWAKENING_ENABLED:-false}
      WAVEWATCH_ENABLED: ${WAVEWATCH_ENABLED:-false}
      MAJORSBOT_ENABLED: ${MAJORSBOT_ENABLED:-true}
      # Disabled 2026-07-31: funding_percentile() tie/cap bug fires false shorts
      # on Bybit's 0.01% funding ceiling (see git history). Re-enable only after
      # a corrected, freshly bake-off-validated funding-fade.
      MAJORSBOT_FUNDINGFADE_ENABLED: ${MAJORSBOT_FUNDINGFADE_ENABLED:-false}
      # Sizing raised 2026-08-13 (was 0.0025 risk / 0.05 cap). The 5% notional
      # cap bound on EVERY trade, throttling real risk to ~$8.56 vs the $24.86
      # the 0.25% setting intended. Now 1% risk with a 50% cap so the
      # risk-based leg binds. Max heat = 6 concurrent × 1% = 6% of equity.
      # R-multiples are risk-normalized, so this does NOT affect the n≥30 gate.
      MAJORSBOT_RISK_PER_TRADE_PCT: ${MAJORSBOT_RISK_PER_TRADE_PCT:-0.01}
      MAJORSBOT_POSITION_SIZE_PCT: ${MAJORSBOT_POSITION_SIZE_PCT:-0.5}
      # newsevent (2026-08-20): two-leg news + volume confirmation, 15-min
      # window, either order. NOT backtested — forward test only, gate n>=30
      # on net R. Stops are OFF by request, so liquidation is the exit and is
      # modelled explicitly.
      MAJORSBOT_NEWSEVENT_ENABLED: ${MAJORSBOT_NEWSEVENT_ENABLED:-true}
      MAJORSBOT_NEWSEVENT_STOP_ENABLED: ${MAJORSBOT_NEWSEVENT_STOP_ENABLED:-false}
      # 10x notional. Measured on 533 real volume-leg events: 4.7% of entries
      # hit liquidation (9.5% adverse move) within the 6h hold, each costing
      # ~95% of equity => ~24% chance of reaching n=30 without one.
      MAJORSBOT_NEWSEVENT_POSITION_SIZE_PCT: ${MAJORSBOT_NEWSEVENT_POSITION_SIZE_PCT:-5}
      # Must be 1: notional = 10x equity means margin = the whole account, so
      # a second concurrent position is not fundable. Paper does not enforce
      # margin, so a higher value would silently simulate the impossible.
      MAJORSBOT_NEWSEVENT_MAX_CONCURRENT: ${MAJORSBOT_NEWSEVENT_MAX_CONCURRENT:-1}
      SCHEDULER_ENABLED: "false"
      RUN_MIGRATIONS: "1"
      RUN_SEED: "0"
    networks:
      - tradecore

  scheduler:
    image: ghcr.io/${GITHUB_REPOSITORY:-obamg/trading_gang}/api:${API_IMAGE_TAG:-latest}
    build:
      context: ./tradecore
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-tradecore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradecore}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: https://getmove.online
      BINANCE_STREAMS_ENABLED: "false"
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-bybit}
      BINANCE_MIN_QUOTE_VOLUME_USD: ${BINANCE_MIN_QUOTE_VOLUME_USD:-10000000}
      WALLETWATCH_ENABLED: ${WALLETWATCH_ENABLED:-false}
      WALLETWATCH_MIN_USD: ${WALLETWATCH_MIN_USD:-25000}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_ENABLED: ${DISCOVERY_AUTO_PROMOTE_ENABLED:-false}
      DISCOVERY_AUTO_PROMOTE_MIN_SCORE: ${DISCOVERY_AUTO_PROMOTE_MIN_SCORE:-250000}
      DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD: ${DISCOVERY_AUTO_PROMOTE_MIN_REALIZED_USD:-50000}
      DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE: ${DISCOVERY_AUTO_PROMOTE_MIN_WIN_RATE:-0.7}
      DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT: ${DISCOVERY_AUTO_PROMOTE_MIN_TOKEN_COUNT:-5}
      DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK: ${DISCOVERY_AUTO_PROMOTE_MAX_PER_TICK:-5}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      LISTINGWATCH_ENABLED: ${LISTINGWATCH_ENABLED:-false}
      AWAKENING_ENABLED: ${AWAKENING_ENABLED:-false}
      WAVEWATCH_ENABLED: ${WAVEWATCH_ENABLED:-false}
      MAJORSBOT_ENABLED: ${MAJORSBOT_ENABLED:-true}
      # Disabled 2026-07-31: funding_percentile() tie/cap bug fires false shorts
      # on Bybit's 0.01% funding ceiling (see git history). Re-enable only after
      # a corrected, freshly bake-off-validated funding-fade.
      MAJORSBOT_FUNDINGFADE_ENABLED: ${MAJORSBOT_FUNDINGFADE_ENABLED:-false}
      # Sizing raised 2026-08-13 (was 0.0025 risk / 0.05 cap). The 5% notional
      # cap bound on EVERY trade, throttling real risk to ~$8.56 vs the $24.86
      # the 0.25% setting intended. Now 1% risk with a 50% cap so the
      # risk-based leg binds. Max heat = 6 concurrent × 1% = 6% of equity.
      # R-multiples are risk-normalized, so this does NOT affect the n≥30 gate.
      MAJORSBOT_RISK_PER_TRADE_PCT: ${MAJORSBOT_RISK_PER_TRADE_PCT:-0.01}
      MAJORSBOT_POSITION_SIZE_PCT: ${MAJORSBOT_POSITION_SIZE_PCT:-0.5}
      # newsevent (2026-08-20): two-leg news + volume confirmation, 15-min
      # window, either order. NOT backtested — forward test only, gate n>=30
      # on net R. Stops are OFF by request, so liquidation is the exit and is
      # modelled explicitly.
      MAJORSBOT_NEWSEVENT_ENABLED: ${MAJORSBOT_NEWSEVENT_ENABLED:-true}
      MAJORSBOT_NEWSEVENT_STOP_ENABLED: ${MAJORSBOT_NEWSEVENT_STOP_ENABLED:-false}
      # 10x notional. Measured on 533 real volume-leg events: 4.7% of entries
      # hit liquidation (9.5% adverse move) within the 6h hold, each costing
      # ~95% of equity => ~24% chance of reaching n=30 without one.
      MAJORSBOT_NEWSEVENT_POSITION_SIZE_PCT: ${MAJORSBOT_NEWSEVENT_POSITION_SIZE_PCT:-5}
      # Must be 1: notional = 10x equity means margin = the whole account, so
      # a second concurrent position is not fundable. Paper does not enforce
      # margin, so a higher value would silently simulate the impossible.
      MAJORSBOT_NEWSEVENT_MAX_CONCURRENT: ${MAJORSBOT_NEWSEVENT_MAX_CONCURRENT:-1}
      SCHEDULER_ENABLED: "true"
      WHALE_ALERT_API_KEY: ${WHALE_ALERT_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      SANTIMENT_API_KEY: ${SANTIMENT_API_KEY:-}
      # SANAPI FREE serves data >30d old and rejects a query whose `to` is past
      # that ceiling. Set to 0 on a paid plan to collect up to today.
      CHAINPULSE_LAG_DAYS: ${CHAINPULSE_LAG_DAYS:-31}
      TRADING_ECONOMICS_API_KEY: ${TRADING_ECONOMICS_API_KEY:-}
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
    command: ["python", "-m", "app.services.scheduler_standalone"]
    healthcheck:
      disable: true
    networks:
      - tradecore

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-obamg/trading_gang}/frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: wss://getmove.online/ws
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - tradecore

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Reload every 6h so a certificate renewed by the certbot service is picked
    # up without a restart — nginx reads certs once at start and would happily
    # serve an expired one until reloaded.
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    networks:
      - tradecore

  # ── TLS renewal ──
  # This service is what was missing before: certificates were issued once by
  # hand and nothing ever renewed them, so the ws.<old-domain> cert quietly
  # expired 2026-07-20 and took the site down five weeks later. certbot exits 0
  # when a cert is not yet due, so this is safe to run twice a day.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'
    networks:
      - tradecore

volumes:
  pg_data:
  redis_data:
  letsencrypt:
  certbot_www:

networks:
  tradecore:
    driver: bridge
