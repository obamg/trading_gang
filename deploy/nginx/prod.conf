worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=100r/m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # Docker DNS resolver — re-resolves upstream names on every request
    # so container IP changes after redeploy are picked up automatically.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Cloudflare: restore the real client IP ──
    # Behind the CF proxy every request arrives from a Cloudflare edge address.
    # Without this, $remote_addr is a CF IP for ALL traffic — which collapses
    # every user into ONE slowapi rate-limit bucket, and login is capped at
    # 10/15min, so a handful of attempts would 429 the entire user base.
    # Only these ranges are trusted, so CF-Connecting-IP cannot be spoofed by
    # someone hitting the origin IP directly.
    # Source: https://www.cloudflare.com/ips-v4 + /ips-v6 (re-check if CF
    # publishes new ranges; they change rarely but they do change).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── HTTP: ACME challenge + HTTPS redirect ──
    # The ACME location MUST stay above the redirect: certbot's webroot renewal
    # is served over plain HTTP, and a blanket 301 would break every renewal.
    server {
        listen 80;
        listen [::]:80;
        server_name getmove.online www.getmove.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://getmove.online$request_uri;
        }
    }

    # ── www → apex redirect ──
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.getmove.online;

        ssl_certificate     /etc/letsencrypt/live/getmove.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/getmove.online/privkey.pem;

        return 301 https://getmove.online$request_uri;
    }

    # ── Main HTTPS server ──
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name getmove.online;

        ssl_certificate     /etc/letsencrypt/live/getmove.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/getmove.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        client_max_body_size 20m;

        # ── ACME challenge (also over HTTPS) ──
        # Cloudflare's "Always Use HTTPS" 301s the plain-HTTP challenge before
        # it reaches the origin. Let's Encrypt follows that redirect, so the
        # challenge has to be served here too or renewals fail once the proxy
        # is switched on. Must stay above the SPA catch-all.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── WebSocket ──
        location /ws {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/ws$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ── Auth endpoints (stricter rate limit) ──
        location ~ ^/api/auth/(.*)$ {
            set $api_upstream http://api:8000;
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass $api_upstream/auth/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API (strip /api prefix) ──
        location /api/ {
            set $api_upstream http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Hashed static assets (1 year cache) ──
        location /assets/ {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend SPA (fallback to index.html) ──
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # NOTE: the old ws.<domain> server block was removed with the domain move.
    # It was legacy — the frontend has always connected to wss://<apex>/ws (see
    # the /ws location above and VITE_WS_URL), so the subdomain served nothing.
    # Its separate Let's Encrypt cert expired 2026-07-20 unnoticed because
    # nothing renewed it. One hostname now means one cert to keep alive.
}
