name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full_deploy:
        description: "Rebuild and redeploy every service, ignoring change detection"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/api
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ----------------------------------------------------------------------
  # Change detection — decides which services need a rebuild + redeploy.
  # Map of source paths to service groups:
  #   tradecore/**          → api (also rebuilds scheduler, same image)
  #   frontend/**           → frontend
  #   docker-compose.prod.yml
  #     scripts/deploy-remote.sh
  #     .github/workflows/deploy.yml  → infra: redeploy everything
  # ----------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      force: ${{ github.event.inputs.force_full_deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'tradecore/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.prod.yml'
              - 'scripts/deploy-remote.sh'
              - 'deploy/nginx/**'
              - '.github/workflows/deploy.yml'

  # ----------------------------------------------------------------------
  # Tests only run when the relevant tree changed (or on manual dispatch).
  # ----------------------------------------------------------------------
  backend-tests:
    name: Backend tests
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tradecore
          POSTGRES_PASSWORD: tradecore
          POSTGRES_DB: tradecore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U tradecore"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tradecore/requirements.txt
      - name: Install deps
        working-directory: tradecore
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite
      - name: Run tests
        working-directory: tradecore
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://tradecore:tradecore@localhost:5432/tradecore_test
          DATABASE_URL_SYNC: postgresql+psycopg2://tradecore:tradecore@localhost:5432/tradecore_test
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_STORAGE_URL: redis://localhost:6379/1
          JWT_SECRET: test-jwt-secret-only-for-ci
          APP_SECRET_KEY: test-app-secret-only-for-ci
          ENCRYPTION_KEY: 8g-1hXY-2V0nD40VOCk3k-c0mHScOBWxCpL_qcfHQZE=
        run: pytest -q

  frontend-tests:
    name: Frontend tests & build
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------
  # Build only the images whose source changed (or both, if infra changed).
  # Each build job is gated by its own `if:` so unchanged images don't rebuild.
  # ----------------------------------------------------------------------
  build-api:
    name: Build & push API image
    needs: [changes, backend-tests]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.api == 'true' ||
       needs.changes.outputs.infra == 'true' ||
       needs.changes.outputs.force == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./tradecore
          push: true
          # cache bust: scope was serving a stale layer that dropped
          # alembic/versions/ files (ba6b6551 build had only 001-003).
          # Bumped scope name to force a fresh cache.
          cache-from: type=gha,scope=api-v2
          cache-to: type=gha,scope=api-v2,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}

  build-frontend:
    name: Build & push frontend image
    needs: [changes, frontend-tests]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true' ||
       needs.changes.outputs.force == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=wss://ws.formationdouane.online/ws
            VITE_GIT_SHA=${{ github.sha }}
            VITE_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  # ----------------------------------------------------------------------
  # Deploy to Hostinger VPS — SSH in, sync the compose file, run the
  # selective deploy script. Restarts only the changed services.
  # ----------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: [changes, build-api, build-frontend]
    # `always()` so this runs even if one of the build jobs was skipped
    # because nothing in its tree changed. We then filter inside: if a
    # build that *should* have run actually failed, abort.
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.api == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true' ||
       needs.changes.outputs.force == 'true') &&
      needs.build-api.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # Never two deploys at once to the same box.
      group: hostinger-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Compute deploy scope
        id: scope
        env:
          API_CHANGED: ${{ needs.changes.outputs.api }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          INFRA_CHANGED: ${{ needs.changes.outputs.infra }}
          FORCE: ${{ needs.changes.outputs.force }}
        run: |
          set -eu
          services=""
          if [[ "$INFRA_CHANGED" == "true" || "$FORCE" == "true" ]]; then
            services="postgres redis api scheduler frontend nginx"
          else
            [[ "$API_CHANGED" == "true" ]] && services="$services api scheduler"
            [[ "$FRONTEND_CHANGED" == "true" ]] && services="$services frontend"
          fi
          services="$(echo "$services" | xargs)"  # trim
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "deploying services: [$services]"

      - name: Verify required secrets are set
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -eu
          missing=""
          [[ -z "${HOSTINGER_SSH_KEY:-}" ]] && missing="$missing HOSTINGER_SSH_KEY"
          [[ -z "${HOSTINGER_SSH_HOST:-}" ]] && missing="$missing HOSTINGER_SSH_HOST"
          [[ -z "${HOSTINGER_SSH_USER:-}" ]] && missing="$missing HOSTINGER_SSH_USER"
          if [[ -n "$missing" ]]; then
            echo "Missing required secrets on the 'production' environment:$missing"
            echo "Configure at: Settings → Environments → production → Environment secrets"
            exit 1
          fi
          echo "ssh key length: ${#HOSTINGER_SSH_KEY} bytes"
          echo "host: $HOSTINGER_SSH_HOST   user: $HOSTINGER_SSH_USER"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust VPS host key
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Pinned host keys, captured 2026-06-03. Public values — SSH host
          # keys are designed to be published (cf. github.com/github/known-hosts).
          # Embedded here instead of fetched via ssh-keyscan to avoid the
          # Hostinger rate-limit that periodically blocks GitHub runner IPs
          # for longer than any reasonable retry window. To rotate after a
          # VPS rebuild: ssh-keyscan -t rsa,ecdsa,ed25519 <host>, paste here.
          {
            echo "${HOSTINGER_SSH_HOST} ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPZyygdybAyYpQcbf8jMh3KhAJOQBOLAI1IqbjagjQZ+OyKTC9w+ZPE+bVlNNdvDjP82uAGKHlo/KUsKdGjF7A8="
            echo "${HOSTINGER_SSH_HOST} ssh-rsa "
            echo "${HOSTINGER_SSH_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM2x8FqOsJqEhk+O9ieKHnJknPZey7/8mMp3CSeIAkMG"
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "host keys pinned from workflow (3 entries)"

      - name: Sync compose file + deploy script to VPS
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_DIR: ${{ secrets.HOSTINGER_DEPLOY_DIR }}
        run: |
          set -eu
          port="${HOSTINGER_SSH_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/trading_gang}"
          ssh -p "$port" "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "mkdir -p $deploy_dir/deploy/nginx"
          scp -P "$port" \
            docker-compose.prod.yml \
            scripts/deploy-remote.sh \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$deploy_dir/"
          scp -P "$port" \
            deploy/nginx/prod.conf \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$deploy_dir/deploy/nginx/"
          ssh -p "$port" "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "chmod +x $deploy_dir/deploy-remote.sh"

      - name: Run selective deploy on VPS
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_DIR: ${{ secrets.HOSTINGER_DEPLOY_DIR }}
          SERVICES: ${{ steps.scope.outputs.services }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          port="${HOSTINGER_SSH_PORT:-22}"
          deploy_dir="${DEPLOY_DIR:-/opt/trading_gang}"
          ssh -p "$port" "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "cd $deploy_dir && DEPLOY_DIR=$deploy_dir ./deploy-remote.sh $SHA $SHA $SERVICES"

      - name: Health probe
        env:
          HEALTH_URL: ${{ secrets.HOSTINGER_HEALTH_URL }}
        run: |
          set -eu
          url="${HEALTH_URL:-}"
          if [[ -z "$url" ]]; then
            echo "HOSTINGER_HEALTH_URL not set — skipping post-deploy probe"
            exit 0
          fi
          echo "waiting 30s for containers to start..."
          sleep 30

          # NOTE: deliberately NO -k here. The previous probe used it, so an
          # expired certificate was invisible — the site sat broken for five
          # weeks while this step stayed green. A cert problem must fail the
          # deploy, because it is exactly what users hit first.
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS "$url" >/dev/null; then
              echo "GET health ok ($url)"
              ok=1
              break
            fi
            echo "attempt $i failed, retrying..."
            sleep 10
          done
          if [[ "$ok" != "1" ]]; then
            echo "health check FAILED after 8 attempts (GET $url)"
            echo "If this is a TLS error, check the certificate — the probe no"
            echo "longer ignores cert failures."
            exit 1
          fi

          # A GET alone is not enough: the outage that prompted this had GETs
          # returning 200 while every POST was reset at the proxy, so login was
          # dead while health looked perfect. Exercise a real POST too.
          login_url="${url%/api/health}/api/auth/login"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 20 -X POST "$login_url" \
            -H 'Content-Type: application/json' \
            -d '{"email":"probe@invalid.example","password":"deliberately-wrong"}' || echo 000)"
          # 401 = the API processed the request and rejected the credentials,
          # which is the healthy answer. 400/422 also prove the request landed.
          case "$code" in
            401|400|422)
              echo "POST login probe ok (HTTP $code — request reached the API)"
              ;;
            000)
              echo "POST login probe FAILED: connection error (reset/TLS/timeout)."
              echo "GET worked but POST did not — this is the signature of a"
              echo "proxy or CDN dropping POST bodies. Login is broken."
              exit 1
              ;;
            *)
              echo "POST login probe FAILED: unexpected HTTP $code"
              exit 1
              ;;
          esac
          echo "health check ok"
